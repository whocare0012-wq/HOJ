services:
  mysql:
    image: ${LOCAL_MYSQL_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - 127.0.0.1::3306
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: ${LOCAL_REDIS_IMAGE}
    command: ["redis-server", "--requirepass", "${LOCAL_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${LOCAL_REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  nacos:
    image: ${LOCAL_NACOS_IMAGE}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
    ports:
      - 127.0.0.1::8848

  sandbox:
    image: ${LOCAL_SANDBOX_IMAGE}
    privileged: true
    entrypoint: [/sandbox]
    command: [--silent=true, --file-timeout=10m, --parallelism=2]
    volumes:
      - type: bind
        source: ${LOCAL_SANDBOX_BINARY}
        target: /sandbox
        read_only: true
      - type: bind
        source: ${LOCAL_JUDGE_WORK_DIRECTORY}
        target: /judge
      - type: bind
        source: ${LOCAL_PRODUCTION_TEST_CASE_DIRECTORY}
        target: /judge/test_case
        read_only: true
    ports:
      - 127.0.0.1::5050

  backend:
    image: ${LOCAL_BACKEND_RUNTIME_IMAGE}
    entrypoint:
      - /usr/lib/jvm/java-1.8.0-openjdk/bin/java
      - -Dfile.encoding=UTF-8
      - -Xms256m
      - -Xmx768m
      - -jar
      - /app/hoj-backend.jar
    environment:
      NACOS_URL: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PUBLIC_HOST: mysql
      MYSQL_PUBLIC_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_PASSWORD}
      MYSQL_DATABASE_NAME: hoj
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD}
      BACKEND_SERVER_PORT: "6688"
      JWT_TOKEN_SECRET: ${LOCAL_JWT_SECRET}
      JUDGE_TOKEN: ${LOCAL_JUDGE_TOKEN}
      AI_ASSISTANT_KEY_ENCRYPTION_SECRET: ${LOCAL_AI_KEY_ENCRYPTION_SECRET}
      OPEN_REMOTE_JUDGE: "false"
      STARTUP_DATABASE_INITIALIZATION_ENABLED: "false"
      PASSWORD_BCRYPT_WRITE_ENABLED: "false"
      PASSWORD_UPGRADE_ON_LOGIN_ENABLED: "false"
      FORCED_UPDATE_REMOTE_JUDGE_ACCOUNT: "false"
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_FILE_PATH: /tmp/hoj-logs
    volumes:
      - type: bind
        source: ${LOCAL_BACKEND_JAR}
        target: /app/hoj-backend.jar
        read_only: true
      - type: bind
        source: ${LOCAL_UPLOADED_FILE_DIRECTORY}
        target: /hoj/file
      - type: bind
        source: ${LOCAL_PRODUCTION_TEST_CASE_DIRECTORY}
        target: /hoj/testcase
    ports:
      - 127.0.0.1::6688
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  judgeserver:
    image: ${LOCAL_JUDGE_RUNTIME_IMAGE}
    entrypoint:
      - /usr/bin/java
      - -Dfile.encoding=UTF-8
      - -Xms256m
      - -Xmx768m
      - -jar
      - /app/hoj-judgeServer.jar
    environment:
      JUDGE_SERVER_PORT: "8088"
      JUDGE_SERVER_IP: judgeserver
      JUDGE_SERVER_NAME: local-judge
      REMOTE_JUDGE_OPEN: "false"
      MAX_TASK_NUM: "2"
      REMOTE_JUDGE_MAX_TASK_NUM: "2"
      NACOS_URL: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      SPRING_PROFILES_ACTIVE: prod
      SANDBOX_BASE_URL: http://sandbox:5050
      LOGGING_FILE_PATH: /tmp/hoj-logs
    volumes:
      - type: bind
        source: ${LOCAL_JUDGE_JAR}
        target: /app/hoj-judgeServer.jar
        read_only: true
      - type: bind
        source: ${LOCAL_JUDGE_WORK_DIRECTORY}
        target: /judge
      - type: bind
        source: ${LOCAL_PRODUCTION_TEST_CASE_DIRECTORY}
        target: /judge/test_case
        read_only: true
    ports:
      - 127.0.0.1::8088
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      sandbox:
        condition: service_started

  frontend:
    image: ${LOCAL_FRONTEND_IMAGE}
    volumes:
      - type: bind
        source: ${LOCAL_FRONTEND_DIST}
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ${LOCAL_NGINX_CONFIG}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 127.0.0.1::80
    depends_on:
      backend:
        condition: service_started
