name: 功能建议 / Feature request
description: 提议改进本 fork 的使用体验或维护流程
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 说明用户场景与现有行为。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述期望行为及适用范围。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
