name: 错误报告 / Bug report
description: 报告 HOJ优化版中可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请使用匿名化数据；不要粘贴账号密码、Token、真实题目测试数据或生产日志。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净页面或环境开始，逐步说明如何触发问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交 SHA
      placeholder: 例如 master 的提交 SHA
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 浏览器、操作系统、Node/Java 版本等
